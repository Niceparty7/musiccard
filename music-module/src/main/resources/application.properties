spring.profiles.include=local,druid
spring.application.name=music-module
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
microservice.internal-token=${MUSICCARD_INTERNAL_TOKEN:dev-internal-token}
mybatis.config-location=classpath:mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis-plus.type-handlers-package=com.beat.mall.music.module.file.handler
oss.bucket=musiccard-resources
oss.region=cn-wuhan-lr
oss.endpoint=https://oss-cn-wuhan-lr.aliyuncs.com
oss.host=https://musiccard-resources.oss-cn-wuhan-lr.aliyuncs.com
oss.dir=uploads
application.pagesize=10
application.sign.key=sign
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
redis.host=localhost
redis.port=6379
redis.password=${MUSICCARD_REDIS_PASSWORD:MusicRedis@2026}
redis.database=0
redis.timeout=3000
redis.pool.max-total=8
redis.pool.max-idle=8
redis.pool.min-idle=0
redis.pool.max-wait=3000

