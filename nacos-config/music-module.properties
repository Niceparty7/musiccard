# Kafka短信任务业务执行线程池
app.sms.executor.core-pool-size=8
app.sms.executor.max-pool-size=16
app.sms.executor.queue-capacity=100

# Quartz JDBC 集群调度；默认关闭，避免启动后自动发送历史待发送任务。
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.scheduler.instanceName=musicSmsQuartz
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.jmx.export=true
spring.quartz.properties.org.quartz.scheduler.jmx.objectName=quartz:type=QuartzScheduler,name=musicSmsQuartz,instanceId=${spring.application.name}-${server.port}
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=5000
spring.quartz.properties.org.quartz.threadPool.threadCount=5
# Kafka 短信主链路
app.sms.kafka.enabled=true
app.sms.kafka.topic=musiccard.sms.send.v1
app.sms.kafka.dlt-topic=musiccard.sms.send.dlt.v1
app.sms.kafka.consumer-group=musiccard-sms-send-v1
app.sms.kafka.concurrency=3
app.sms.kafka.publish-timeout-seconds=10
app.sms.kafka.backup-retention-days=7
app.sms.kafka.pending-timeout-seconds=300
app.sms.kafka.processing-lease-seconds=300
app.sms.kafka.max-retry-count=2
app.sms.kafka.retry-delay-seconds=60
app.sms.kafka.compensation-batch-size=100

spring.kafka.bootstrap-servers=${MUSICCARD_KAFKA_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${app.sms.kafka.consumer-group}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=200
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.beat.mall.music.module.sms.kafka.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.beat.mall.music.module.sms.kafka.model.SmsTaskMessage
spring.kafka.consumer.properties.fetch.max.wait.ms=500
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual_immediate

spring.data.mongodb.uri=${MUSICCARD_MONGODB_URI:mongodb://localhost:27017/musiccard_sms}
spring.data.mongodb.auto-index-creation=true

# Quartz 仅负责 Kafka/MongoDB 异常任务补偿，默认关闭，确认环境后再开启。
app.sms.compensation.enabled=false
app.sms.compensation.interval-seconds=30
app.sms.compensation.job-name=smsKafkaCompensationJob
app.sms.compensation.trigger-name=smsKafkaCompensationTrigger
app.sms.compensation.group=SMS

spring.datasource.druid.connection-properties=config.decrypt=true;config.decrypt.key=${public-key}
spring.datasource.druid.filter.config.enabled=true
spring.datasource.druid.initial-size=5
spring.datasource.druid.max-active=20
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-wait=60000
spring.datasource.druid.pool-prepared-statements=true
spring.datasource.druid.max-open-prepared-statements=20
spring.datasource.druid.time-between-eviction-runs-millis=2000
spring.datasource.druid.min-evictable-idle-time-millis=60000
spring.datasource.druid.max-evictable-idle-time-millis=300000
spring.datasource.druid.filters=config,stat,wall,slf4j
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=500
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=123456
spring.datasource.druid.web-stat-filter.enabled=true
spring.datasource.druid.web-stat-filter.url-pattern=/*
spring.datasource.druid.web-stat-filter.exclusions=*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*
spring.datasource.druid.web-stat-filter.session-stat-enable=true
spring.datasource.druid.web-stat-filter.session-stat-max-count=100000
spring.datasource.druid.web-stat-filter.profile-enable=true
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
spring.datasource.druid.stat-view-servlet.reset-enable=true
spring.datasource.druid.web-stat-filter.principal-session-name=admin
spring.datasource.druid.web-stat-filter.principal-cookie-name=admin
spring.datasource.druid.stat-view-servlet.allow=127.0.0.1
spring.datasource.druid.stat-view-servlet.deny=
spring.datasource.druid.filter.wall.enabled=true
spring.datasource.druid.filter.wall.db-type=mysql
spring.datasource.druid.filter.wall.config.alter-table-allow=false
spring.datasource.druid.filter.wall.config.truncate-allow=false
spring.datasource.druid.filter.wall.config.drop-table-allow=false
spring.datasource.druid.filter.wall.config.none-base-statement-allow=false
spring.datasource.druid.filter.wall.config.update-where-none-check=true
spring.datasource.druid.filter.wall.config.select-into-outfile-allow=false
spring.datasource.druid.filter.wall.config.metadata-allow=true
spring.datasource.druid.filter.wall.log-violation=true
spring.datasource.druid.filter.wall.throw-exception=true
