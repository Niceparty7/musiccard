spring.application.name=music-console
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
microservice.internal-token=${MUSICCARD_INTERNAL_TOKEN:dev-internal-token}
application.session.key=_USER
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
spring.session.store-type=redis
spring.session.redis.namespace=musiccard:session
server.servlet.session.cookie.name=MUSICCARD_SESSION
spring.data.redis.host=${redis.host}
spring.data.redis.port=${redis.port}
spring.data.redis.password=${redis.password}
spring.data.redis.database=0
spring.data.redis.client-type=jedis
redis.host=localhost
redis.port=6379
redis.password=${MUSICCARD_REDIS_PASSWORD:MusicRedis@2026}
