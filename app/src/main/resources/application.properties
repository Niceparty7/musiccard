spring.profiles.include=local,druid

spring.application.name=app

server.port=8080

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

spring.jackson.default-property-inclusion=non_absent

oss.bucket=musiccard-resources
oss.region=cn-wuhan-lr
oss.endpoint=https://oss-cn-wuhan-lr.aliyuncs.com
oss.host=https://musiccard-resources.oss-cn-wuhan-lr.aliyuncs.com
oss.dir=uploads

mybatis.config-location=classpath:mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis-plus.type-handlers-package=com.beat.mall.module.file.handler

application.isapp=1
application.pagesize=10
application.sign.key=sign
application.session.key=_USER

# \u5355\u4E2A\u6587\u4EF6\u6700\u5927\uFF08\u89C6\u9891\u901A\u5E38\u8F83\u5927\uFF0C\u7ED9\u5230 500MB \u6216\u6309\u4E1A\u52A1\u5B9A\uFF09
spring.servlet.multipart.max-file-size=100MB
# \u6574\u4E2A\u8BF7\u6C42\u6700\u5927\uFF08\u5305\u542B multipart boundary \u7B49\u5F00\u9500\uFF09
spring.servlet.multipart.max-request-size=200MB
# \u6587\u4EF6\u5199\u5165\u78C1\u76D8\u7684\u9608\u503C\uFF08\u9ED8\u8BA4 0\uFF0C\u5EFA\u8BAE\u4FDD\u6301\uFF0C\u5426\u5219\u5927\u6587\u4EF6\u4F1A\u5168\u7559\u5185\u5B58\uFF09
spring.servlet.multipart.file-size-threshold=10MB
# \u662F\u5426\u542F\u7528 multipart \u89E3\u6790
spring.servlet.multipart.enabled=true

redis.host=localhost
redis.port=6379
redis.password=MusicRedis@2026
redis.database=0
redis.timeout=3000
redis.pool.max-total=8
redis.pool.max-idle=8
redis.pool.min-idle=0
redis.pool.max-wait=3000
